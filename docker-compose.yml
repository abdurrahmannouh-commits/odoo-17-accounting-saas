version: '3.8'

services:
  web:
    image: odoo:19.0
    container_name: odoo_saas_web
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_saas_secret_2026
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: odoo_saas_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_saas_secret_2026
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    container_name: odoo_saas_caddy
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
  caddy-data:
  caddy-config:
